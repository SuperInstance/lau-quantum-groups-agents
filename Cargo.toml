[package]
name = "lau-quantum-groups-agents"
version = "0.1.0"
edition = "2021"
description = "Quantum groups (Hopf algebras) for agents — algebraic structure of symmetry including classical groups as a special case"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nalgebra = { version = "0.33", features = ["serde-serialize"] }
num-complex = { version = "0.4", features = ["serde"] }

[dev-dependencies]
approx = "0.5"
